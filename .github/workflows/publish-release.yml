name: Publish Vietnamese Game Release

on:
  push:
    tags:
      - 'v0.60.0-vi'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Vietnamese build
        shell: bash
        run: |
          set -euo pipefail
          url='https://amin.finnvnoi.top/s/fb46d191-e54e-4627-942f-96478c4212ba/dl'
          out='gacha_vi_0.60.0.zip'
          expected_size='159819655'
          expected_sha='7368395fd4b6da7e1e0a58a14430f46aef53258e5a517f93d0f5411d124203f6'

          rm -f "$out"
          for attempt in {1..12}; do
            echo "Download attempt $attempt..."
            curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
              --continue-at - -X POST -o "$out" "$url" || true

            size="$(stat -c%s "$out" 2>/dev/null || echo 0)"
            echo "Current size: $size / $expected_size"
            if [ "$size" = "$expected_size" ]; then
              break
            fi
            sleep 3
          done

          test "$(stat -c%s "$out")" = "$expected_size"
          echo "$expected_sha  $out" | sha256sum -c -

      - name: Create release and upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset='gacha_vi_0.60.0.zip'
          notes_file='release-notes.md'
          cat > "$notes_file" <<'EOF'
          Bản Việt hóa của game 抽卡版PVZ 0.60.0.

          Asset: `gacha_vi_0.60.0.zip`

          SHA-256:
          `7368395fd4b6da7e1e0a58a14430f46aef53258e5a517f93d0f5411d124203f6`
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bản Việt hóa v0.60.0" \
              --notes-file "$notes_file"
          fi
